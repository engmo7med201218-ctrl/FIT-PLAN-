<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="510" height="510" x="1" y="1" rx="127" fill="none" stroke="rgba(16, 185, 129, 0.25)" stroke-width="2" />

  <!-- Speed motion arcs -->
  <path d="M 80 200 A 180 180 0 0 1 200 80" fill="none" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round" opacity="0.4" stroke-dasharray="12 16" />
  <path d="M 60 250 A 210 210 0 0 1 250 60" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" opacity="0.2" />

  <!-- Treadmill Base Deck -->
  <path d="M 90 380 L 410 330 C 430 327 440 340 430 355 L 110 405 C 90 410 80 395 90 380 Z" fill="#334155" />
  <path d="M 115 375 L 395 332" stroke="url(#accentGrad)" stroke-width="12" stroke-linecap="round" filter="url(#glow)" />

  <!-- Treadmill Arm / Console Frame -->
  <path d="M 370 335 L 340 180 L 300 170" fill="none" stroke="#64748b" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Display Screen / Console -->
  <rect x="290" y="145" width="45" height="30" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="3" />
  <circle cx="312" cy="160" r="4" fill="#10b981" />

  <!-- Dynamic Running Figure -->
  <!-- Head -->
  <circle cx="270" cy="160" r="24" fill="#f8fafc" />
  
  <!-- Torso leaning forward -->
  <path d="M 265 190 L 235 260" stroke="#f8fafc" stroke-width="18" stroke-linecap="round" />
  
  <!-- Back Arm (pumping forward) -->
  <path d="M 255 205 L 295 220 L 315 200" fill="none" stroke="#94a3b8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Front Arm (pumping back) -->
  <path d="M 255 205 L 210 215 L 195 245" fill="none" stroke="url(#accentGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Front Leg (lifting high knee) -->
  <path d="M 235 260 L 285 285 L 290 340" fill="none" stroke="url(#accentGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Back Leg (extended back stride) -->
  <path d="M 235 260 L 175 280 L 140 340" fill="none" stroke="#cbd5e1" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Calorie Fire Sparkle / Heart Rate Badge -->
  <g transform="translate(380, 100)">
    <circle cx="0" cy="0" r="32" fill="#1e293b" stroke="url(#fireGrad)" stroke-width="3" />
    <path d="M -10 -2 C -18 -10 -8 -20 0 -10 C 8 -20 18 -10 10 -2 C 2 12 0 16 0 16 C 0 16 -2 12 -10 -2 Z" fill="url(#fireGrad)" filter="url(#glow)" />
  </g>
</svg>
